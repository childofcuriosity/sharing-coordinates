[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "router-sharing-graph"
version = "0.1.0"
description = "Identifiability and decision audits for learned cross-layer parameter sharing"
requires-python = ">=3.8"
dependencies = ["numpy>=1.21", "torch>=2.2", "matplotlib>=3.5", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]
aslora = ["transformers>=4.36.2", "datasets>=2.16.1"]
llm = ["transformers==4.57.6", "huggingface-hub==0.36.2", "accelerate==1.11.0", "tokenizers==0.22.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
